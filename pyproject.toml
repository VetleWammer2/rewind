[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewind"
version = "0.1.0"
description = "Find the first operation where two supposedly identical training runs diverge."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vetle Wammer" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/VetleWammer2/rewind"

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
rewind = "rewind.cli:main"

[tool.setuptools]
packages = ["rewind"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
