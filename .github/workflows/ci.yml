name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU package and test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install ".[test]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: README CPU demo smoke test
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/tests/smoke_cpu_demo.py"
